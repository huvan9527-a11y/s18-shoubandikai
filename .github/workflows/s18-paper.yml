name: S18 日线与开盘信号扫描

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/**'
  schedule:
    # 北京时间16:50首次触发，扫描完成后目标17:00发送；17:17/18:17重试。
    - cron: '50 8 * * 1-5'
    - cron: '17 9,10 * * 1-5'
  workflow_dispatch:
    inputs:
      dates:
        description: 'Completed dates separated by spaces; blank scans latest two trading days'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: s18-preview
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test execution and ledger protections
        run: python -m unittest discover -s tests -v
      - name: Review saved account without executing or replaying trades
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('state/daily_accounts.json')
          if path.exists():
              state = json.loads(path.read_text())
              for name in ('A','B'):
                  print(name, 'cash=',state[name]['cash'],'positions=',len(state[name]['positions']))
          else:
              print('No captured account yet; preview scan does not create trades')
          PY
      - name: Scan latest two completed trading days without credentials
        id: scan
        if: success() || failure()
        env:
          SCAN_DATES: ${{ inputs.dates }}
          NOTIFY_AT: ${{ github.event_name == 'schedule' && '17:00' || '' }}
          SERVERCHAN_SENDKEY: ${{ github.ref == 'refs/heads/main' && (secrets.SERVERCHAN_SENDKEY || secrets.SERVERCHAN_KEY || secrets.SERVER_CHAN_SENDKEY || secrets.SCKEY) || '' }}
        run: |
          notify_args=(--latest-notification)
          if [ -n "$NOTIFY_AT" ]; then notify_args+=(--notify-at "$NOTIFY_AT"); fi
          if [ -n "$SCAN_DATES" ]; then
            read -r -a dates <<< "$SCAN_DATES"
            python -u -m src.scan --dates "${dates[@]}" "${notify_args[@]}"
          else
            python -u -m src.scan "${notify_args[@]}"
          fi
      - name: Publish report to run summary
        if: always()
        run: |
          for report in outputs/signals-*.md; do
            [ ! -f "$report" ] || cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -f outputs/latest.md ]; then cat outputs/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f outputs/paper-status.json ]; then cat outputs/paper-status.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Persist successful days and failure status
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/metadata
          for file in outputs/signals-*.json outputs/signals-*.md; do
            [ ! -f "$file" ] || git add "$file"
          done
          if [ -f state/notifications.json ]; then git add state/notifications.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update S18 daily signals [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s18-paper-reports-${{ github.run_id }}
          path: |
            outputs/
            logs/
          retention-days: 30

