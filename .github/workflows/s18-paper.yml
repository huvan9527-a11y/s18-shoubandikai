name: S18 20万元模拟仓

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/**'
  schedule:
    - cron: '23 8,10 * * 1-5'
  workflow_dispatch:
    inputs:
      dates:
        description: 'Completed dates separated by spaces; blank scans latest two trading days'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: s18-paper-account
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[restart-scan]') }}

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test execution and ledger protections
        run: python -m unittest discover -s tests -v
      - name: Scan latest two completed trading days without credentials
        id: scan
        env:
          SCAN_DATES: ${{ inputs.dates }}
        run: |
          if [ -n "$SCAN_DATES" ]; then
            read -r -a dates <<< "$SCAN_DATES"
            python -u -m src.scan --dates "${dates[@]}"
          else
            python -u -m src.scan
          fi
      - name: Replay verified completed minutes with public data
        if: success()
        run: python -u -m src.run
      - name: Publish report to run summary
        if: always()
        run: |
          for report in outputs/signals-*.md; do
            [ ! -f "$report" ] || cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Persist successful days and failure status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state outputs logs
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update S18 paper ledger [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s18-paper-reports-${{ github.run_id }}
          path: |
            outputs/
            logs/
          retention-days: 30
