name: S18 开盘竞价提醒

on:
  schedule:
    # Prewarm at 05:47 CST: allow several hours of GitHub scheduler delay.
    # GitHub cron is best-effort; the live gate must still reject a late start.
    - cron: '47 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s18-paper-account
  cancel-in-progress: false

jobs:
  opening-alert:
    runs-on: ubuntu-latest
    # Starts at 05:47 CST, prepares at 09:15, alerts at 09:26, then books A/B paper fills.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Reject a runner that already missed the opening window
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo('Asia/Shanghai'))
          deadline = now.replace(hour=9, minute=35, second=59, microsecond=0)
          message = f'Opening runner started at {now.isoformat()}; deadline={deadline.isoformat()}'
          print(message, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(message + '\\n')
          if now.weekday() >= 5 or now > deadline:
              raise SystemExit('MISSED_OPENING_WINDOW: no live alert or opening fills may be recorded')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Wait until 09:15 preparation
        run: |
          python - <<'PY'
          import datetime as dt
          import time
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Shanghai')
          now = dt.datetime.now(tz)
          target = now.replace(hour=9, minute=15, second=0, microsecond=0)
          while now < target:
              time.sleep(min(10, (target - now).total_seconds()))
              now = dt.datetime.now(tz)
          print(f'Opening preparation starts: {now.isoformat()}')
          PY
      - name: Validate prior-session candidates
        run: python -u -m src.opening_push --prepare
      - name: Wait for the live opening window
        id: window
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import time
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Shanghai')
          now = dt.datetime.now(tz)
          if now.weekday() >= 5:
              print(f'Opening alert skipped on weekend: {now.isoformat()}')
              live = False
          else:
              target = now.replace(hour=9, minute=26, second=0, microsecond=0)
              deadline = now.replace(hour=9, minute=35, second=59, microsecond=0)
              while now < target:
                  time.sleep(min(10, (target - now).total_seconds()))
                  now = dt.datetime.now(tz)
              live = now <= deadline
              if live:
                  print(f'Opening alert window reached: {now.isoformat()}')
              else:
                  print(f'Opening alert skipped after live window: {now.isoformat()}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'live={str(live).lower()}\n')
          PY
      - name: Fail if the live opening window was missed
        if: steps.window.outputs.live != 'true'
        run: |
          echo "Opening alert did not execute: runner missed the 09:26-09:35 window or live gate output was missing"
          exit 1
      - name: Verify auction quotes and send opening candidates
        if: steps.window.outputs.live == 'true'
        env:
          SERVERCHAN_SENDKEY: ${{ github.ref == 'refs/heads/main' && (secrets.SERVERCHAN_SENDKEY || secrets.SERVERCHAN_KEY || secrets.SERVER_CHAN_SENDKEY || secrets.SCKEY) || '' }}
        run: python -u -m src.opening_push
      - name: Wait for 09:30 opening
        if: (success() || failure()) && steps.window.outputs.live == 'true'
        run: |
          python - <<'PYCODE'
          import datetime as dt
          import time
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(ZoneInfo('Asia/Shanghai'))
          target = now.replace(hour=9, minute=30, second=3, microsecond=0)
          while now < target:
              time.sleep(min(5, (target-now).total_seconds()))
              now = dt.datetime.now(ZoneInfo('Asia/Shanghai'))
          PYCODE
      - name: Persist auction evidence before opening execution
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- outputs
          if [ -f state/opening_notifications.json ]; then git add state/opening_notifications.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve S18 auction evidence [skip ci]'
            git push origin HEAD:main
          fi
      - name: Book A and B opening-price fills and push confirmations
        if: (success() || failure()) && steps.window.outputs.live == 'true'
        env:
          SERVERCHAN_SENDKEY: ${{ github.ref == 'refs/heads/main' && (secrets.SERVERCHAN_SENDKEY || secrets.SERVERCHAN_KEY || secrets.SERVER_CHAN_SENDKEY || secrets.SCKEY) || '' }}
        run: |
          while true; do
            if python -u -m src.daily_accounts open; then exit 0; fi
            current=$(TZ=Asia/Shanghai date +%H%M)
            if [ "$current" -ge 0936 ]; then exit 1; fi
            sleep 10
          done
      - name: Persist opening state and morning paper ledger
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- state/account.json logs outputs
          if [ -f state/daily_accounts.json ]; then git add state/daily_accounts.json; fi
          if [ -f state/opening_notifications.json ]; then git add state/opening_notifications.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist S18 morning paper ledger [skip ci]'
            git push origin HEAD:main
          fi

