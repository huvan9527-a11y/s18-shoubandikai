name: S18 开盘竞价提醒

on:
  schedule:
    # Start at 08:00 CST to allow runner setup; prepare at 09:15, alert from 09:26.
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s18-paper-account
  cancel-in-progress: false

jobs:
  opening-alert:
    runs-on: ubuntu-latest
    # Starts at 08:00, prepares at 09:15, alerts at 09:26, then records completed morning bars.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Wait until 09:15 preparation
        run: |
          python - <<'PY'
          import datetime as dt
          import time
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Shanghai')
          now = dt.datetime.now(tz)
          target = now.replace(hour=9, minute=15, second=0, microsecond=0)
          while now < target:
              time.sleep(min(10, (target - now).total_seconds()))
              now = dt.datetime.now(tz)
          print(f'Opening preparation starts: {now.isoformat()}')
          PY
      - name: Validate prior-session candidates
        run: python -u -m src.opening_push --prepare
      - name: Wait for the live opening window
        id: window
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import time
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Shanghai')
          now = dt.datetime.now(tz)
          if now.weekday() >= 5:
              print(f'Opening alert skipped on weekend: {now.isoformat()}')
              live = False
          else:
              target = now.replace(hour=9, minute=26, second=0, microsecond=0)
              deadline = now.replace(hour=9, minute=35, second=59, microsecond=0)
              while now < target:
                  time.sleep(min(10, (target - now).total_seconds()))
                  now = dt.datetime.now(tz)
              live = now <= deadline
              if live:
                  print(f'Opening alert window reached: {now.isoformat()}')
              else:
                  print(f'Opening alert skipped after live window: {now.isoformat()}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'live={str(live).lower()}\\n')
          PY
      - name: Fail if the live opening window was missed
        if: steps.window.outputs.live != 'true'
        run: |
          echo "Opening alert did not execute: runner missed the 09:26-09:35 window or live gate output was missing"
          exit 1
      - name: Verify auction quotes and send opening candidates
        if: steps.window.outputs.live == 'true'
        env:
          SERVERCHAN_SENDKEY: ${{ github.ref == 'refs/heads/main' && (secrets.SERVERCHAN_SENDKEY || secrets.SERVERCHAN_KEY || secrets.SERVER_CHAN_SENDKEY || secrets.SCKEY) || '' }}
        run: python -u -m src.opening_push
      - name: Wait for completed morning minute bars
        id: morning
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import time
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Shanghai')
          now = dt.datetime.now(tz)
          if now.weekday() >= 5:
              paper = False
          else:
              target = now.replace(hour=9, minute=37, second=0, microsecond=0)
              deadline = now.replace(hour=10, minute=0, second=59, microsecond=0)
              while now < target:
                  time.sleep(min(10, (target - now).total_seconds()))
                  now = dt.datetime.now(tz)
              paper = now <= deadline
          print(f'Morning minute replay eligible={paper}; current time={now.isoformat()}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'paper={str(paper).lower()}\\n')
          PY
      - name: Fail if morning paper window was missed
        if: steps.morning.outputs.paper != 'true'
        run: |
          echo "Morning paper ledger did not execute: runner missed the 09:37-10:00 window or paper gate output was missing"
          exit 1
      - name: Record completed morning buys in the paper ledger
        if: steps.morning.outputs.paper == 'true'
        shell: bash
        run: |
          while true; do
            if python -u -m src.opening_push --paper-morning; then
              exit 0
            fi
            current=$(TZ=Asia/Shanghai date +%H%M)
            if [ "$current" -ge 1001 ]; then
              echo "Morning minute data remained unavailable through 10:00 CST"
              exit 1
            fi
            echo "Morning minute data not complete yet; retrying in 45 seconds"
            sleep 45
          done
      - name: Persist opening state and morning paper ledger
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- state/account.json logs outputs
          if [ -f state/opening_notifications.json ]; then git add state/opening_notifications.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist S18 morning paper ledger [skip ci]'
            git push origin HEAD:main
          fi
